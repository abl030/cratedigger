# EXPERIMENT — mutmut evaluation config (see mutmut-shell.nix).
# Scoping pattern: source_paths names the package root (everything gets
# copied into mutants/), only_mutate narrows actual mutation to the target
# file. Never list a source_paths member in also_copy — the verbatim copy
# would silently overwrite the mutated file.
[tool.mutmut]
source_paths = ["web"]
only_mutate = ["web/wrong_match_queue_view.py"]
pytest_add_cli_args_test_selection = [
    "tests/web/test_wrong_match_queue_view.py",
    "tests/web/test_routes_imports.py",
]
also_copy = ["lib", "scripts", "harness", "migrations"]
debug = true
