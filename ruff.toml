required-version = ">=0.16.0"
# Match the supported runtime declared in pyrightconfig.json; the development
# shell may exercise a newer interpreter.
target-version = "py313"

# mutmut's per-run output tree (docs/mutation-testing.md). Deleted after
# every run by rule; excluded here as defense-in-depth so a leftover copy
# of the whole source tree cannot balloon a whole-repo pass (#1208 shape).
extend-exclude = ["mutants"]

[lint]
# Issue #1322 measured every Ruff family against the whole tree before
# enabling any: these three found zero present-day bugs (full bugbear had
# three cosmetic hits, fixed in the same change; DTZ and BLE001 had none)
# and are kept as legislation against future drift, not as a finding.
# The style families (SIM, C4, RET, PERF, RUF, TRY) were rejected there
# with their numbers; do not add them without a new measurement.
extend-select = [
  "B",       # flake8-bugbear: mutable defaults, loop-variable capture, raise-from
  "BLE001",  # blind `except Exception`: every broad except must say why (`# noqa: BLE001`)
  "DTZ",     # naive datetimes in a pipeline built on tz-aware timestamps
  "TID251",
]

[lint.flake8-tidy-imports.banned-api]
"tests".msg = "Runtime code must not import test-only modules."

[lint.per-file-ignores]
"scripts/run_fuzz_tests.py" = [
  "TID251", # Deliberate adapter that discovers and runs tests.
]
"scripts/run_python_tests.py" = [
  "TID251", # Deliberate adapter that discovers and runs tests.
]
"tests/**" = [
  "TID251",
]
"tools/vulture/whitelist.py" = [
  "B018",
  "F821",
]
