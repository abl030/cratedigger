required-version = ">=0.16.0"
# Match the supported runtime declared in pyrightconfig.json; the development
# shell may exercise a newer interpreter.
target-version = "py313"

# mutmut's per-run output tree (docs/mutation-testing.md). Deleted after
# every run by rule; excluded here as defense-in-depth so a leftover copy
# of the whole source tree cannot balloon a whole-repo pass (#1208 shape).
extend-exclude = ["mutants"]

[lint]
extend-select = [
  "B905",
  "TID251",
]

[lint.flake8-tidy-imports.banned-api]
"tests".msg = "Runtime code must not import test-only modules."

[lint.per-file-ignores]
"scripts/run_fuzz_tests.py" = [
  "TID251", # Deliberate adapter that discovers and runs tests.
]
"scripts/run_python_tests.py" = [
  "TID251", # Deliberate adapter that discovers and runs tests.
]
"tests/**" = [
  "TID251",
]
"tools/vulture/whitelist.py" = [
  "B018",
  "F821",
]
